name: Add simple Google Sheets guide
on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-sheets-simple-guide.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert simple guide toggle
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          target = '<details><summary>[참고] Google Sheets 데이터 연동 저장 방법</summary>'
          if target not in s:
              raise SystemExit('target toggle not found')
          block = '''<details><summary>[참고] Google Sheets 데이터 연동 저장 방법[심플 버전]</summary><div class="details-body"><p>아래 예시를 확인하고 작업 진행해보세요.</p><p><a href="https://heejeong-kim.github.io/ku-ai-nest2/batchless_student_mvp.html" target="_blank" rel="noopener noreferrer">[MVP 예시]</a><br><a href="https://docs.google.com/spreadsheets/d/16yyPm49X53fW1zMfIho-TR6Ipr9hWV7bXzrFSdMBOFY/edit?gid=0#gid=0" target="_blank" rel="noopener noreferrer">[구글시트 예시]</a></p><p><b>간략 프로세스</b></p><ol><li>MVP 생성시 어떤 데이터를 구글 시트로 저장하겠다고 선언 후 작업</li><li>구글 시트 생성하여 첫번째 행에 항목명 매칭하여 입력</li><li>구글 시트 URL, 하단 시트명을 AI에게 전달하여 Apps Script 요청함</li><li>구글 시트 &gt; 확장 프로그램 &gt; Apps Script 선택</li><li>AI가 전달 준 Apps Script 코드를 code.gs에 삽입</li><li>우측 하단 [배포] &gt; 새배포 &gt; 웹앱 &gt; 엑세스 권한 모든 사용자 &gt; 배포</li><li>권한 요청시 계속 눌러서 권한 부여하고 모든 엑세스 승인 처리</li><li>배포후 나오는 배포 ID를 AI에 전달하여 MVP 수정요청</li><li>데이터 저장 재확인</li><li>수정이 필요한 경우 배포 &gt; 배포관리 &gt; 수정 &gt; 배포 처리해야함 (필수)</li></ol></div></details>'''
          if '[참고] Google Sheets 데이터 연동 저장 방법[심플 버전]' in s:
              raise SystemExit('simple guide already exists')
          p.write_text(s.replace(target, block + target, 1))
          PY
      - name: Commit change and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/add-sheets-simple-guide.yml
          git add index.html
          git commit -m 'feat: add simple Google Sheets integration guide'
          git push
