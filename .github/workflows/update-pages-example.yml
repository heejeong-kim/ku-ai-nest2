name: Update GitHub Pages example URL
on:
  push:
    paths:
      - '.github/workflows/update-pages-example.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update text
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<li><b>배포 주소 확인</b><br>잠시 후 다음 형태의 주소가 생성됨</li>'
          new = '<li><b>배포 주소 확인</b><br>잠시 후 다음 형태의 주소가 생성됨<br>예) https://heejeong-kim.github.io/nest-mvp</li>'
          if old not in s:
              raise SystemExit('target text not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and clean up workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/update-pages-example.yml
          git commit -m 'fix: add GitHub Pages example URL'
          git push
