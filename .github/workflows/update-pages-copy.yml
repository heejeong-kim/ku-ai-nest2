name: Update Pages copy
on:
  push:
    branches: [main]
    paths: ['.github/workflows/update-pages-copy.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='4. 잠시 후 다음 형태의 주소가 생성됨'
          new='4. 잠시 후 다음 형태의 주소가 생성됨(Repository →  Settings >Pages  재접근'
          if old not in s:
              raise SystemExit('target text not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit change and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/update-pages-copy.yml
          git add index.html
          git commit -m 'fix: clarify GitHub Pages URL step'
          git push
