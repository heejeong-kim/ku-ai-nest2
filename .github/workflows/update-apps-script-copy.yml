name: Update Apps Script copy
on:
  push:
    branches: [main]
    paths: ['.github/workflows/update-apps-script-copy.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<h4>4) Apps Script 코드 입력</h4><p>직접 AI와 대화하면서 최종 확정 필요 Apps Script에 입력, 구글 시트명 반드시 확인하여 동일하게 구성</p>'
          new = '<h4>4) Apps Script 코드 입력</h4><p>직접 AI와 대화하면서 최종 Apps Script에 삽입할 코드 요청하여 복사 &gt; 입력, 구글 시트명 반드시 확인하여 코드내 명칭과 동일하게 구성</p>'
          if old not in s:
              raise SystemExit('target text not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit change and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/update-apps-script-copy.yml
          git add index.html
          git commit -m 'fix: update Apps Script instruction copy'
          git push
