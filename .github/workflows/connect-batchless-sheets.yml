name: Connect BatchLess Sheets
on:
  push:
    branches: [main]
    paths: ['.github/workflows/connect-batchless-sheets.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect BatchLess MVP to Apps Script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('batchless_student_mvp.html')
          s = p.read_text()

          endpoint = 'https://script.google.com/macros/s/AKfycbyK0c3ks9lJgUyOm2cQR5Ww86VkVp-yf9LVW5xsQFPFiEKeyoffCRH9E5yCtiAKV2XU/exec'

          replacements = [
            (
              '<strong>0건 저장</strong><span>매장 입력값과 분석 결과를 외부 서버에 전송하지 않음</span>',
              '<strong>Sheets 저장</strong><span>분석 실행 시 오늘의 마감 데이터를 Google Sheets에 저장</span>'
            ),
            (
              '<div class="privacy">● 이 MVP는 입력값을 저장하거나 Google Sheets로 전송하지 않습니다.</div>',
              '<div class="privacy">● 생산 범위 분석을 실행하면 입력한 오늘의 마감 데이터가 Google Sheets에 저장됩니다.</div>'
            ),
            (
              '<span class="tag">No POS · No login · No Google storage</span>',
              '<span class="tag">No POS · No login · Google Sheets 기록</span>'
            ),
            (
              '<script>\nconst $=s=>document.querySelector(s)',
              f"<script>\nconst APPS_SCRIPT_URL='{endpoint}';\nconst $=s=>document.querySelector(s)"
            ),
            (
              "if(!made||sold+discount+waste>made){alert('판매·할인·폐기 합계가 생산 수량을 넘지 않는지 확인해 주세요.');return}",
              "if(!made||sold+discount+waste>made){alert('판매·할인·폐기 합계가 생산 수량을 넘지 않는지 확인해 주세요.');return false}"
            ),
            (
              "$('#empty').style.display='none';$('#output').classList.add('on')}$('#form').onsubmit=e=>{e.preventDefault();run()};",
              "$('#empty').style.display='none';$('#output').classList.add('on');return true}async function saveClosingData(){const payload={item:$('#item').value.trim(),made:Number($('#made').value),sold:Number($('#sold').value),discount:Number($('#discount').value||0),waste:Number($('#waste').value||0),day:$('#day').options[$('#day').selectedIndex].text,weather:$('#weather').options[$('#weather').selectedIndex].text};try{await fetch(APPS_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})}catch(err){console.error('Google Sheets 저장 실패',err)}}$('#form').onsubmit=e=>{e.preventDefault();if(run())saveClosingData()};"
            ),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit('target not found: ' + old[:100])
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Commit update and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/connect-batchless-sheets.yml
          git add batchless_student_mvp.html
          git commit -m 'feat: save BatchLess closing data to Google Sheets'
          git push
