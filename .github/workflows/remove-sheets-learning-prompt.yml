name: Remove Sheets Learning Prompt Toggle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-sheets-learning-prompt.yml'

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove nested learning prompt toggle only
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          outer_summary = '<summary>Google Sheets 데이터 설계 — 연동이 필요한 경우 개인별 실행</summary>'
          inner_start = '<details class="learning-prompt"><summary>[참고] 학습을 위한 디테일 프롬프트</summary>'
          selected_prompt = '<div class="prompt-head"><span>markdown · 선택 프롬프트</span>'

          outer_pos = text.find(outer_summary)
          if outer_pos == -1:
              raise SystemExit('Target outer Google Sheets toggle not found')

          inner_pos = text.find(inner_start, outer_pos)
          if inner_pos == -1:
              raise SystemExit('Target nested learning prompt toggle not found')

          selected_pos = text.find(selected_prompt, outer_pos)
          if selected_pos == -1:
              raise SystemExit('Selected prompt block not found')
          if not (inner_pos < selected_pos):
              raise SystemExit('Unexpected target ordering')

          # The target learning-prompt block contains no nested <details>, so remove
          # from its opening tag through its first closing </details> only.
          inner_end = text.find('</details>', inner_pos)
          if inner_end == -1 or inner_end > selected_pos:
              raise SystemExit('Could not safely locate target closing tag')
          inner_end += len('</details>')

          new_text = text[:inner_pos] + text[inner_end:]

          # Safety checks: outer Sheets toggle and selected prompt must remain.
          if outer_summary not in new_text:
              raise SystemExit('Outer Google Sheets toggle would be removed')
          if selected_prompt not in new_text:
              raise SystemExit('Selected prompt would be removed')

          # Ensure the deleted learning prompt no longer exists between outer toggle
          # and selected prompt.
          new_outer = new_text.find(outer_summary)
          new_selected = new_text.find(selected_prompt, new_outer)
          if inner_start in new_text[new_outer:new_selected]:
              raise SystemExit('Nested learning prompt still present')

          path.write_text(new_text, encoding='utf-8')
          print('Removed only the nested [참고] 학습을 위한 디테일 프롬프트 toggle.')
          PY

      - name: Remove one-time workflow
        run: git rm .github/workflows/remove-sheets-learning-prompt.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: remove Sheets learning prompt toggle"
          git push origin main
